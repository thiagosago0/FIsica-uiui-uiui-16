var B = [
{id:"uni",n:"Unidades & Potência de 10",h:`
<h2>Unidades do Sistema Internacional (SI) e Conversões</h2>
<p>Na Física, misturar unidades diferentes (ex: usar centímetros numa fórmula que pede metros) é a causa número 1 de erros. Sempre converta para o padrão antes de calcular.</p>
<div class="wrap"><table><tr><th>Grandeza</th><th>Unidade Padrão (SI)</th><th>Conversões mais cobradas</th></tr>
<tr><td>Massa (m)</td><td>quilograma (kg)</td><td>1 kg = 1.000 g &nbsp;|&nbsp; 1 g = 10⁻³ kg</td></tr>
<tr><td>Comprimento / Área</td><td>metro (m) / m²</td><td>1 m = 100 cm = 1.000 mm &nbsp;|&nbsp; 1 mm = 10⁻³ m</td></tr>
<tr><td>Força (F / P / T)</td><td>Newton (N)</td><td>1 N = 1 kg·m/s²</td></tr>
<tr><td>Pressão (P)</td><td>Pascal (Pa)</td><td>1 atm ≈ 1,0 · 10⁵ Pa (100.000 Pa)</td></tr>
<tr><td>Temperatura (T)</td><td>Kelvin (K)</td><td>T(K) = θ(°C) + 273</td></tr>
<tr><td>Calor (Q)</td><td>Joule (J) ou caloria (cal)</td><td>1 cal ≈ 4,18 J (em calorimetria usa-se muito cal, g e °C juntos!)</td></tr></table></div>
<h3>Potência de 10 sem sofrimento</h3>
<p>Números muito grandes ou muito pequenos usam base 10. Ex: <code>1,0 · 10⁵</code> é o 1 seguido de 5 zeros (100.000). Já <code>1,2 · 10⁻⁵</code> significa andar a vírgula 5 casas para a esquerda (0,000012).</p>
<div class="tip"><b>Regra de ouro nas contas:</b><br>• <b>Multiplicando:</b> multiplica os números e <b>soma</b> os expoentes → (2·10³) · (3·10²) = 6·10⁵.<br>• <b>Dividindo:</b> divide os números e <b>subtrai</b> os expoentes → (5·10⁵) / (1·10²) = 5·10³.</div>`},

{id:"vet",n:"Forças, Seno e Equilíbrio",h:`
<h2>O que é uma Força e como funciona o Equilíbrio?</h2>
<p>Força é qualquer empurrão ou puxão capaz de alterar o movimento ou deformar um corpo. Como ela tem direção e sentido (para cima, para baixo, inclinada), chamamos de <b>grandeza vetorial</b>.</p>
<h3>Equilíbrio Estático (Repouso)</h3>
<p>Um objeto parado só continua parado se a soma de todas as forças sobre ele der zero. Na vertical, tudo que puxa para cima tem que empatar com tudo que puxa para baixo.</p>
<div class="f">Força resultante = 0 &nbsp;⇒&nbsp; Forças para cima = Forças para baixo</div>
<p><b>Exemplo:</b> Um painel de 8 kg sofre a ação da gravidade puxando para baixo (Peso = 80 N). Para ficar parado pendurado num cabo, o cabo precisa puxar para cima com exatos <b>80 N</b> (Tração).</p>
<h3>Por que aparece o Seno (sin θ) nas fórmulas?</h3>
<p>Quando você empurra ou puxa algo inclinado (num ângulo θ), apenas uma parte da sua força trabalha na direção que importa. A trigonometria separa essa parte útil usando o <b>seno</b> ou o <b>cosseno</b>.</p>
<div class="wrap"><table><tr><th>Ângulo (θ)</th><th>sin(θ)</th><th>Significado prático no Torque</th></tr>
<tr><td>0° ou 180°</td><td>0</td><td>Empurrar paralelo à chave de boca: não gira nada (torque zero).</td></tr>
<tr><td>30°</td><td>0,5 (1/2)</td><td>Apenas metade da sua força gera rotação.</td></tr>
<tr><td>90° (perpendicular)</td><td>1 (máximo)</td><td>100% da força gera rotação. É o ângulo ideal!</td></tr></table></div>`},

{id:"den",n:"Densidade e Pressão",h:`
<h2>Densidade (Massa Específica)</h2>
<p>A densidade (representada pela letra grega <b>ρ</b>, lê-se "rô") diz o quanto de massa está apertada dentro de um certo volume. Ferro é denso (muita massa em pouco espaço); isopor é pouco denso.</p>
<div class="f">ρ = m / V &nbsp;&nbsp; (unidade SI: kg/m³)</div>
<p><b>Na prática:</b> A água doce tem densidade de 1.000 kg/m³ (cada 1 m³ de água pesa 1.000 kg). A água do mar tem sal dissolvido, por isso é um pouco mais densa: cerca de <b>1.020 kg/m³</b>.</p>
<h2>O conceito de Pressão</h2>
<p>Pressão não é a mesma coisa que força! Pressão é a <b>força distribuída sobre uma área</b>.</p>
<div class="f">P = F / A &nbsp;&nbsp; (unidade SI: N/m² = Pascal [Pa])</div>
<div class="tip"><b>Exemplo intuitivo:</b> Se você apertar a palma da mão com um dedo, dói pouco. Se aplicar a <i>mesma força</i> com a ponta de uma agulha, fura a pele. Por quê? Porque a área (A) da agulha é minúscula, fazendo a pressão (P) disparar! É esse mesmo princípio que faz a prensa hidráulica multiplicar forças.</div>`}
];

// 2. MECÂNICA & HIDROSTÁTICA
var M = [
{id:"est",n:"Peso e Equilíbrio Estático",h:`
<h2>Força Peso (P)</h2>
<p>É a força com que a Terra (gravidade) atrai qualquer corpo que tenha massa. Aponta sempre verticalmente para baixo.</p>
<div class="f">P = m · g</div>
<p><b>m</b> = massa em kg &nbsp;·&nbsp; <b>g</b> = aceleração da gravidade (geralmente 10 m/s²).</p>
<h3>Tração em Cabos e Equilíbrio</h3>
<p>Quando um corpo está suspenso por um fio ou cabo e permanece <b>totalmente em repouso</b>, dizemos que está em equilíbrio estático. A força que o cabo faz para segurá-lo chama-se <b>Tração (T)</b>.</p>
<p>Como não há movimento, a tração anula exatamente o peso:</p>
<div class="f">T = P = m · g</div>
<p><b>Exemplo da prova:</b> Painel de massa 8 kg suspenso por um cabo vertical, com g = 10 m/s².<br>P = 8 · 10 = <b>80 N</b>. Logo, a tração do cabo é <b>80 N</b>.</p>`},

{id:"tor",n:"Torque (Momento de uma Força)",h:`
<h2>O que é Torque (τ)?</h2>
<p>Torque (letra grega <b>τ</b>, "tau") é a capacidade de uma força fazer um objeto <b>girar</b> em torno de um eixo (como abrir uma porta ou soltar um parafuso com uma chave de boca).</p>
<div class="f">τ = F · d · sin(θ)</div>
<p><b>F</b> = força aplicada (N) &nbsp;·&nbsp; <b>d</b> = braço de alavanca (distância até o eixo de giro, em m) &nbsp;·&nbsp; <b>θ</b> = ângulo entre a força e a ferramenta.</p>
<h3>Como maximizar o Torque fazendo menos força?</h3>
<p>Observe a fórmula: como F, d e sin(θ) estão multiplicando, para ter o maior giro possível com o menor esforço:</p>
<ol><li><b>Aumente a distância (d):</b> Segure na ponta mais distante do parafuso (aumenta o braço de alavanca).</li>
<li><b>Aplique força perpendicular (θ = 90°):</b> Como sin(90°) = 1, toda a sua força vira giro.</li></ol>
<svg viewBox="0 0 340 120" width="100%" style="max-width:360px" role="img" aria-label="Chave de boca aplicando torque">
<circle cx="45" cy="60" r="16" fill="none" stroke="currentColor" stroke-width="3"/>
<polygon points="45,50 54,55 54,65 45,70 36,65 36,55" fill="var(--ac)"/>
<rect x="61" y="54" width="210" height="12" rx="4" fill="currentColor" opacity=".3"/>
<line x1="45" y1="90" x2="265" y2="90" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="4"/>
<text x="145" y="106" fill="var(--mu)" font-size="13">Braço de alavanca (d)</text>
<line x1="265" y1="54" x2="265" y2="12" stroke="#e8890c" stroke-width="3"/>
<polygon points="265,6 259,18 271,18" fill="#e8890c"/>
<text x="275" y="25" fill="#e8890c" font-size="13" font-weight="bold">F (90°)</text>
</svg>
<div class="tip"><b>Por que a maçaneta da porta fica longe das dobradiças?</b> Exatamente para aumentar a distância <b>d</b> e permitir que você abra a porta com um toque leve!</div>`},

{id:"ste",n:"Teorema de Stevin (Pressão na Água)",h:`
<h2>Pressão Hidrostática e Pressão Absoluta</h2>
<p>Quando você mergulha numa piscina ou no mar, sente pressão nos ouvidos porque o peso de toda a coluna de água acima de você está te esmagando. Quanto mais fundo (maior <b>h</b>), maior a pressão.</p>
<div class="f">P<sub>abs</sub> = P<sub>atm</sub> + ρ · g · h</div>
<ul><li><b>P<sub>abs</sub>:</b> Pressão absoluta (total) no fundo.</li>
<li><b>P<sub>atm</sub>:</b> Pressão atmosférica na superfície (≈ 1,0 · 10⁵ Pa).</li>
<li><b>ρ · g · h:</b> Pressão apenas da coluna de líquido (hidrostática).</li></ul>
<h3>Resolvendo o problema do mergulhador passo a passo</h3>
<p>O enunciado diz que a pressão total é <b>6 vezes maior</b> que a pressão atmosférica (P<sub>abs</sub> = 6 · P<sub>atm</sub>). Substituindo na fórmula:</p>
<p>6 · P<sub>atm</sub> = P<sub>atm</sub> + ρ · g · h<br>6 · P<sub>atm</sub> − P<sub>atm</sub> = ρ · g · h &nbsp;→&nbsp; <b>5 · P<sub>atm</sub> = ρ · g · h</b></p>
<p>Com P<sub>atm</sub> = 10⁵ Pa, ρ = 1.020 kg/m³ e g = 10 m/s²:<br>5 · 100.000 = 1.020 · 10 · h &nbsp;→&nbsp; 500.000 = 10.200 · h &nbsp;→&nbsp; h = 500.000 / 10.200 ≈ <b>49 m</b>.</p>
<div class="tip"><b>Atalho mental:</b> A cada 10 metros de profundidade na água, a pressão aumenta cerca de <b>1 atm</b>! Se a pressão total é 6 atm (1 atm do ar + 5 atm da água), a profundidade tem que ser perto de 50 metros (49 m na água salgada).</div>`},

{id:"pas",n:"Princípio de Pascal (Prensa Hidráulica)",h:`
<h2>Como funciona uma Prensa Hidráulica?</h2>
<p>O Princípio de Pascal afirma que qualquer aumento de pressão num líquido preso (como o óleo de um elevador de oficina) transmite-se integralmente para todos os pontos desse líquido.</p>
<div class="f">P₁ = P₂ &nbsp;⇒&nbsp; F₁ / A₁ = F₂ / A₂</div>
<p>Como os pistões geralmente são círculos (Área = π · r²), podemos cortar o π dos dois lados e usar direto o <b>raio ao quadrado</b>:</p>
<div class="f">F₁ / r₁² = F₂ / r₂²</div>
<h3>Exemplo da oficina (levantando um carro)</h3>
<p>Carro de 1.200 kg → Peso (F₂) = 1.200 · 10 = <b>12.000 N</b>. Pistão menor r₁ = 5 cm; pistão maior r₂ = 25 cm.</p>
<p>F₁ / 5² = 12.000 / 25² &nbsp;→&nbsp; F₁ / 25 = 12.000 / 625</p>
<p>Note que 625 é 25 vezes maior que 25! Logo, a força necessária F₁ será 25 vezes menor que o peso do carro:<br>F₁ = 12.000 / 25 = <b>480 N</b>.</p>
<div class="tip"><b>Atenção ao raio ao quadrado:</b> Se o raio do pistão maior é <b>5 vezes</b> maior que o do menor (25 cm vs 5 cm), a área é <b>5² = 25 vezes</b> maior! Por isso a força é multiplicada por 25. (Nota: no gabarito original do PDF houve um erro de digitação 25 × 19,2 = 240 N, mas 25 × 19,2 é matematicamente <b>480 N</b>!).</div>`}
];

// 3. TERMOLOGIA & TERMODINÂMICA
var T = [
{id:"esc",n:"Escalas Termométricas (Kelvin)",h:`
<h2>Temperatura e Agitação Molecular</h2>
<p>Temperatura mede o grau de agitação das moléculas de um corpo. Quanto mais rápido elas vibram, maior a temperatura.</p>
<h3>A Escala Absoluta Kelvin (K)</h3>
<p>Diferente da escala Celsius (que escolheu o congelamento e ebulição da água como referência), a escala Kelvin começa no <b>Zero Absoluto (0 K)</b> — o ponto teórico onde a agitação térmica das partículas é mínima.</p>
<div class="f">T<sub>K</sub> = θ<sub>C</sub> + 273</div>
<div class="wrap"><table><tr><th>Evento</th><th>Celsius (°C)</th><th>Kelvin (K)</th></tr>
<tr><td>Zero Absoluto</td><td>−273 °C</td><td>0 K (não existe K negativo!)</td></tr>
<tr><td>Fusão do gelo (madrugada)</td><td>0 °C</td><td>273 K</td></tr>
<tr><td>Tarde no deserto</td><td>40 °C</td><td>313 K</td></tr></table></div>
<div class="tip"><b>Pegadinha clássica sobre variação (ΔT):</b><br>De 0 °C para 40 °C, a temperatura subiu <b>40 °C</b>.<br>Em Kelvin, foi de 273 K para 313 K: subiu 313 − 273 = <b>40 K</b>!<br>O tamanho de 1 grau Celsius é <b>exatamente igual</b> ao de 1 Kelvin (Δθ<sub>C</sub> = ΔT<sub>K</sub>).</div>`},

{id:"dil",n:"Dilatação Térmica Linear",h:`
<h2>Por que os trilhos de trem têm folgas?</h2>
<p>Quando aquecidas, as moléculas vibram com mais força e se afastam umas das outras, fazendo o material aumentar de tamanho. Em barras, fios e trilhos, o aumento acontece principalmente no comprimento (<b>dilatação linear</b>).</p>
<div class="f">ΔL = L₀ · α · ΔT</div>
<ul><li><b>ΔL:</b> Quanto o comprimento aumentou (L<sub>final</sub> − L₀).</li>
<li><b>L₀:</b> Comprimento inicial.</li>
<li><b>α (alfa):</b> Coeficiente de dilatação linear (depende do material, ex: aço).</li>
<li><b>ΔT:</b> Variação de temperatura (T<sub>final</sub> − T<sub>inicial</sub>).</li></ul>
<h3>Cálculo do trilho de aço</h3>
<p>Dados: L₀ = 30 m, α = 1,2 · 10⁻⁵ °C⁻¹, ΔT = 20 °C.</p>
<p>ΔL = 30 · (1,2 · 10⁻⁵) · 20<br>Multiplique os números normais: 30 · 1,2 · 20 = 720.<br>Junte a potência: ΔL = 720 · 10⁻⁵ m = 0,0072 m.</p>
<p>Para passar de metros para milímetros, multiplique por 1.000 (ande 3 casas para a direita):<br>0,0072 m = <b>7,2 mm</b>.</p>`},

{id:"cal",n:"Calorimetria (Sensível e Latente)",h:`
<h2>As duas funções do Calor (Q)</h2>
<p>Calor é energia térmica em trânsito (vai sempre do corpo mais quente para o mais frio). Quando um corpo recebe calor, duas coisas podem acontecer — <b>nunca as duas ao mesmo tempo</b>:</p>
<h3>1. Calor Sensível (muda a temperatura, mantém o estado)</h3>
<div class="f">Q = m · c · ΔT &nbsp;&nbsp; ("Que Macete")</div>
<p><b>c</b> = calor específico (quanto calor 1 g precisa para subir 1 °C). Da água líquida vale <b>1 cal/(g·°C)</b>.</p>
<h3>2. Calor Latente (muda o estado físico, mantém a temperatura)</h3>
<div class="f">Q = m · L &nbsp;&nbsp; ("Que Moleza")</div>
<p><b>L</b> = calor latente (quanto calor 1 g precisa para derreter ou ferver). Fusão do gelo vale <b>80 cal/g</b>.</p>
<h3>Exemplo completo: Gelo a 0 °C virando Água a 30 °C (m = 30 g)</h3>
<ol><li><b>Etapa 1 – Derreter o gelo (0 °C → água a 0 °C):</b><br>Q₁ = m · L = 30 · 80 = <b>2.400 cal</b>.</li>
<li><b>Etapa 2 – Esquentar a água (0 °C → 30 °C):</b><br>Q₂ = m · c · ΔT = 30 · 1 · (30 − 0) = <b>900 cal</b>.</li>
<li><b>Calor Total:</b> Q<sub>total</sub> = 2.400 + 900 = <b>3.300 cal</b>.</li></ol>`},

{id:"fas",n:"Diagrama de Fases e Substância Anômala",h:`
<h2>Lendo um Diagrama de Fases (Pressão × Temperatura)</h2>
<p>É um mapa que mostra em qual estado físico (sólido, líquido ou vapor) uma substância está para qualquer combinação de pressão e temperatura.</p>
<ul><li><b>Ponto Tríplice:</b> O ponto exato onde os três estados (sólido, líquido e vapor) coexistem em equilíbrio ao mesmo tempo.</li>
<li><b>Aquecimento isobárico (pressão constante acima do ponto tríplice):</b> Traçando uma linha horizontal da esquerda para a direita (aumentando T), o material sai do <b>Sólido → passa pelo Líquido → vira Vapor</b>.</li></ul>
<h3>O comportamento anômalo da Água (inclinação negativa)</h3>
<p>A maioria das substâncias expande ao derreter. A água é uma exceção famosa: o gelo ocupa <b>mais volume</b> que a água líquida (por isso a garrafa estoura no congelador e o gelo boia no copo).</p>
<div class="tip"><b>Consequência no gráfico:</b> A linha de fusão da água é inclinada para a esquerda (<b>inclinação negativa</b>). Isso significa que:<br>1. Ao fundir (sólido → líquido), a substância <b>diminui de volume</b>.<br>2. Se você pegar vapor numa temperatura baixa e aumentar muito a pressão (subindo verticalmente no gráfico), ele pode passar para o estado <b>sólido</b> e, com ainda mais pressão, virar <b>líquido</b>!</div>`},

{id:"ter",n:"Gases e 1ª Lei da Termodinâmica",h:`
<h2>Transformações Gasosas</h2>
<p>O estado de um gás ideal depende de três variáveis: Pressão (P), Volume (V) e Temperatura (T).</p>
<div class="wrap"><table><tr><th>Nome da Transformação</th><th>O que fica constante?</th><th>Exemplo</th></tr>
<tr><td><b>Isotérmica</b></td><td>Temperatura (ΔT = 0)</td><td>Bolha subindo lentamente no mar trocando calor com a água.</td></tr>
<tr><td><b>Isobárica</b></td><td>Pressão (ΔP = 0)</td><td>Gás aquecido num recipiente com tampa móvel livre.</td></tr>
<tr><td><b>Isovolumétrica (Isocórica)</b></td><td>Volume (ΔV = 0)</td><td>Aquecer gás dentro de uma panela de pressão fechada.</td></tr>
<tr><td><b>Adiabática</b></td><td>Não troca calor (Q = 0)</td><td>Descompressão muito rápida de um spray aerossol.</td></tr></table></div>
<h2>Primeira Lei da Termodinâmica</h2>
<p>É a lei da conservação de energia aplicada aos gases: o calor (Q) que o gás recebe serve para aumentar sua energia interna (ΔU, ligada à temperatura) e/ou realizar trabalho (W, expandir empurrando um pistão).</p>
<div class="f">ΔU = Q − W</div>
<h3>O que acontece num Ciclo Completo?</h3>
<p>Num motor térmico, o gás expande, comprime e <b>volta exatamente ao estado inicial</b> (mesma P, V e T de partida).</p>
<ul><li>Como a temperatura final é igual à inicial, a variação da energia interna é zero (<b>ΔU = 0</b>).</li>
<li>Jogando na fórmula: 0 = Q − W &nbsp;⇒&nbsp; <b>W = Q</b> (todo o calor líquido absorvido virou trabalho).</li></ul>`}
];

// Simulado
var qi=0,score=0,done=false;
function quiz(){
  var box=$("quiz");
  if(qi>=Q.length){
    box.innerHTML='<h2>Resultado do Simulado</h2><p>Você acertou <b>'+score+' de '+Q.length+'</b> questões.</p><button id="rs">Refazer Simulado</button>';
    $("rs").onclick=function(){qi=0;score=0;quiz()};
    return;
  }
  var q=Q[qi];done=false;
  box.innerHTML='<p class="mu">Questão '+(qi+1)+' de '+Q.length+'</p><h3 style="color:inherit">'+q[0]+'</h3><div id="os"></div><div id="fb"></div><div class="row"><span class="mu">Acertos: '+score+'</span><button id="nx" hidden>Próxima</button></div>';
  var order=q[1].map(function(_,k){return k}).sort(function(){return Math.random()-.5});
  order.forEach(function(k){
    var b=document.createElement("button");
    b.className="opt";
    b.textContent=q[1][k];
    b.onclick=function(){
      if(done)return;
      done=true;
      var ok=k===q[2];
      if(ok)score++;
      Array.prototype.forEach.call($("os").children,function(x){if(x.textContent===q[1][q[2]])x.classList.add("ok")});
      if(!ok)b.classList.add("no");
      $("fb").innerHTML='<div class="tip"><b>'+(ok?"Correto!":"Atenção:")+'</b> '+q[3]+'</div>';
      $("nx").hidden=false;
      $("nx").textContent=qi===Q.length-1?"Ver resultado":"Próxima";
      $("nx").onclick=function(){qi++;quiz()};
    };
    $("os").appendChild(b);
  });
}
quiz();
